home:
  hero:
    - eyebrow: Limited Offer
      title: End of Year Mega Sale
      text: Save up to Rp 12 million on selected units, plus a free one-year service package.
    - eyebrow: Showroom
      title: See It Before You Buy It
      text: Hundreds of units ready to ship, neatly displayed and yours to sit on any time.
    - eyebrow: Community
      title: Join Hundreds of HTZL Riders
      text: Monthly tours, safe riding classes, and members-only service discounts.
    - eyebrow: Event
      title: New Model Launch Night
      text: Be the first to ride the latest Kawasaki and Vixian line-up.
    - eyebrow: Heritage
      title: A Museum of Legendary Engines
      text: A historic collection that has kept the riding spirit alive since 2016.
  intro_eyebrow: About Us
  intro_title: A dealership that actually understands riders
  intro_text: >-
    HTZL Motorcycle Club is a motorcycle dealership dedicated to Kawasaki and
    Vixian. Founded on 30 December 2016 in Jakarta, we grew from a small workshop
    into a dealer network with certified technicians and the deepest parts stock
    around. Our mission is simple: deliver quality service and products so every
    ride you take is a better one.
  stats:
    - value: "%{count}"
      label: Catalogue items
    - value: "100"
      label: Heritage units 1903-2017
    - value: "2016"
      label: Founded
    - value: "4.8/5"
      label: Customer rating
  kawasaki_title: Kawasaki 2022 Models
  kawasaki_sub: Find the Kawasaki that matches the way you ride.
  vixian_title: Vixian 2022 Models
  vixian_sub: The latest Vixian line-up, from daily supermoto to cross-country adventure.
  catalog_title: Everything You Need to Ride
  catalog_sub: Motorcycles, apparel, spare parts, lubricants, touring accessories and workshop services.
  news_title: Latest News
  news_sub: Stories from the racetrack, the factory, and the HTZL community.
  cta_title: Ready to take your dream bike home?
  cta_text: Fill in the reservation form or message our team directly. We usually reply in under 10 minutes.
  features:
    - title: Fast delivery
      text: Delivered across Greater Jakarta in 3 working days, other cities in 7.
    - title: Official warranty
      text: Three-year engine warranty and free extra protection, with no hidden fees.
    - title: Full support
      text: Our team answers on WhatsApp every day during opening hours.

