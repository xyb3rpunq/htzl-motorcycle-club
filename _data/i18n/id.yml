  intro_eyebrow: Tentang Kami
  intro_title: Dealer motor yang benar-benar mengerti rider
  intro_text: >-
    HTZL Motorcycle Club adalah dealer sepeda motor khusus Kawasaki dan Vixian.
    Berdiri 30 Desember 2016 di Jakarta, kami tumbuh dari bengkel kecil menjadi
    jaringan dealer dengan teknisi bersertifikat dan stok suku cadang terlengkap.
    Misi kami sederhana: memberi layanan dan produk berkualitas supaya setiap
    perjalanan Anda lebih nyaman.
