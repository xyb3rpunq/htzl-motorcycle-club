  kawasaki_title: Kawasaki 2022年モデル
  kawasaki_sub: あなたの走り方に合うKawasakiを見つけてください。
  vixian_title: Vixian 2022年モデル
  vixian_sub: 街乗りスーパーモトから長距離アドベンチャーまで、最新のVixianラインナップ。
  catalog_title: 走りに必要なすべて
  catalog_sub: 車両、ウェア、パーツ、オイル、ツーリング用品、そして整備サービス。
  news_title: 最新ニュース
  news_sub: サーキット、工場、そしてHTZLコミュニティからのお知らせ。
  cta_title: 憧れの一台を迎える準備はできましたか。
  cta_text: 予約フォームからでも、直接ご連絡いただいても構いません。平均10分以内に返信します。
  features:
    - title: 迅速な配送
      text: ジャカルタ首都圏は3営業日、その他の都市は7日でお届けします。
    - title: 正規保証
      text: エンジン3年保証に加え、追加保護を無料付帯。隠れた費用はありません。
    - title: 手厚いサポート
      text: 営業時間内であれば、WhatsAppで毎日ご相談を承ります。

