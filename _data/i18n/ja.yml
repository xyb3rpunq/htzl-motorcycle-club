home:
  hero:
    - eyebrow: 期間限定
      title: 年末メガセール
      text: 対象車両が最大1,200万ルピア引き。さらに1年間の無料点検パックが付きます。
    - eyebrow: ショールーム
      title: 買う前に、実車を確かめる
      text: 即納可能な車両を数百台展示。いつでもまたがってご確認いただけます。
    - eyebrow: コミュニティ
      title: 数百人のHTZLライダーの仲間へ
      text: 毎月のツーリング、安全運転講習、会員限定の整備割引をご用意。
    - eyebrow: イベント
      title: ニューモデル発表ナイト
      text: KawasakiとVixianの最新ラインナップを、誰よりも先に体感してください。
    - eyebrow: 伝統
      title: 名機を集めたミュージアム
      text: 2016年から走る歓びを受け継いできた、歴史的車両のコレクション。
  intro_eyebrow: 私たちについて
  intro_title: ライダーを本当に理解している販売店
  intro_text: >-
    HTZL Motorcycle Clubは、KawasakiとVixianを専門に扱うバイク販売店です。
    2016年12月30日にジャカルタで創業し、小さな整備工場から、認定整備士と
    充実した部品在庫を備えた販売網へと成長しました。私たちの使命はシンプルです。
    質の高いサービスと製品を届け、お客様のすべての走行をより快適にすることです。
  stats:
    - value: "%{count}"
      label: カタログ掲載点数
    - value: "100"
      label: 1903〜2017年の収蔵車
    - value: "2016"
      label: 創業年
