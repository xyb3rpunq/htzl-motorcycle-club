home:
  hero:
    - eyebrow: Ограниченное предложение
      title: Мега-распродажа в конце года
      text: Скидка до 12 млн рупий на избранные мотоциклы и год бесплатного обслуживания в подарок.
    - eyebrow: Салон
      title: Посмотрите вживую перед покупкой
      text: Сотни мотоциклов готовы к отгрузке, аккуратно выставлены, присесть можно в любой момент.
    - eyebrow: Сообщество
      title: Присоединяйтесь к сотням райдеров HTZL
      text: Ежемесячные выезды, курсы безопасного вождения и скидки на сервис для участников.
    - eyebrow: Событие
      title: Вечер премьеры новых моделей
      text: Первыми испытайте новейшую линейку Kawasaki и Vixian.
    - eyebrow: Наследие
      title: Музей легендарных двигателей
      text: Историческая коллекция, хранящая дух мотоциклизма с 2016 года.
  intro_eyebrow: О нас
  intro_title: Дилер, который действительно понимает райдеров
  intro_text: >-
    HTZL Motorcycle Club — мотосалон, специализирующийся на марках Kawasaki и
    Vixian. Компания основана 30 декабря 2016 года в Джакарте и выросла из
    небольшой мастерской в дилерскую сеть с сертифицированными механиками и
    самым полным складом запчастей. Наша задача проста: давать качественный
    сервис и товары, чтобы каждая ваша поездка была комфортнее.
  stats:
    - value: "%{count}"
      label: Позиций в каталоге
    - value: "100"
      label: Раритетов 1903-2017
    - value: "2016"
      label: Год основания
    - value: "4.8/5"
      label: Оценка клиентов
  kawasaki_title: Модели Kawasaki 2022
  kawasaki_sub: Найдите Kawasaki, который подходит вашему стилю езды.
  vixian_title: Модели Vixian 2022
  vixian_sub: "Свежая линейка Vixian: от городского супермото до дальнего эндуро."
  catalog_title: Всё для поездки
  catalog_sub: Мотоциклы, экипировка, запчасти, масла, туристические аксессуары и сервис.
  news_title: Последние новости
  news_sub: Истории с трассы, с завода и из сообщества HTZL.
  cta_title: Готовы забрать мотоцикл мечты?
  cta_text: Заполните форму бронирования или напишите нам напрямую. Обычно отвечаем меньше чем за 10 минут.
  features:
    - title: Быстрая доставка
      text: По Большой Джакарте за 3 рабочих дня, в другие города за 7.
    - title: Официальная гарантия
      text: Три года гарантии на двигатель и бесплатная дополнительная защита без скрытых платежей.
    - title: Полная поддержка
      text: Наша команда отвечает в WhatsApp каждый день в рабочие часы.

