      title: 传奇发动机博物馆
      text: 自 2016 年起延续骑行精神的历史车款收藏。
  intro_eyebrow: 关于我们
  intro_title: 真正懂骑士的摩托车经销商
  intro_text: >-
    HTZL Motorcycle Club 是专营 Kawasaki 与 Vixian 的摩托车经销商。
    我们于 2016 年 12 月 30 日在雅加达成立，从一间小型修理厂成长为拥有认证技师
    与充足零件库存的经销网络。我们的使命很简单：提供优质的服务与产品，
    让您的每一次骑行都更加舒适。
